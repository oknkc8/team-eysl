name: guard

# This repository is public and the legacy app still carries the club president's
# production Supabase credentials. These checks are the mechanical backstop for the
# two mistakes that would actually hurt: leaking a secret, and pointing new code at
# the production database.

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It must stay ignored."
            exit 1
          fi
          echo "ok: .env is not tracked"

      - name: No service keys or private keys
        run: |
          # Match key SHAPES, not role names. "service_role" on its own is a
          # Postgres role that legitimately appears in SQL and in grant output —
          # the first version of this check failed on a migration comment quoting
          # an ACL. What actually indicates a leak is a secret key prefix, a JWT,
          # or a private key block.
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|SERVICE_ROLE_KEY[[:space:]]*[:=]|BEGIN [A-Z ]*PRIVATE KEY' \
               -- . ':!.github/workflows/guard.yml'; then
            echo "::error::A secret-shaped string is committed."
            exit 1
          fi
          echo "ok: no secret-shaped strings"

  production-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Production project ref stays quarantined in the legacy file
        run: |
          # rbghqyhzvczavtjwiocc is the club president's LIVE project, holding real
          # member data we have no authority over. It legitimately appears in the
          # frozen legacy index.html; anywhere else means new code could write to it.
          # Two kinds of appearance are legitimate and everything else is not:
          #   index.html          — the frozen legacy app, which genuinely connects there
          #   app/src/lib/env.ts  — the runtime blocklist that REFUSES that ref, plus its test
          # A ref inside a blocklist is the opposite of a leak, so allow exactly
          # those paths rather than weakening the check everywhere.
          PROD_REF=rbghqyhzvczavtjwiocc
          HITS=$(git grep -lF "$PROD_REF" -- . \
                   ':!index.html' \
                   ':!app/src/lib/env.ts' \
                   ':!app/src/lib/env.test.ts' \
                   ':!.github/workflows/guard.yml' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Production project ref found outside the legacy file and the runtime blocklist:"
            echo "$HITS"
            exit 1
          fi

          # And prove the blocklist is still a blocklist, not a config value that
          # someone quietly turned into a connection target.
          if ! grep -q 'FORBIDDEN_PROJECT_REF' app/src/lib/env.ts; then
            echo "::error::env.ts no longer declares FORBIDDEN_PROJECT_REF — the runtime guard is gone."
            exit 1
          fi
          echo "ok: production ref confined to the legacy file and the runtime blocklist"
